name: Deploy to Server
on:
  push:
    branches:
      - main
env:
  PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Sync to project path
        run: |
          robocopy $env:GITHUB_WORKSPACE $env:PROJECT_PATH /E /XD .git node_modules /XF "*.log" "*.pem" "*.env*"
          if ($LASTEXITCODE -le 7) { exit 0 }
          exit 1

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm install --omit=dev

      - name: Restart app service
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          .\DsaPayroll-App.exe restart
          Start-Sleep -Seconds 15

      - name: Show service status
        working-directory: ${{ env.PROJECT_PATH }}
        run: .\DsaPayroll-App.exe status

      - name: Notify on failure
        if: failure()
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          Write-Host "Deploy failed at $(Get-Date)"
          .\DsaPayroll-App.exe status
